<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Crop Recommendation System</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<div class="container mt-5">
		<h1 class="text-center text-success">Crop Recommendation System🌱</h1>
		<form action="/predict" method="POST" class="bg-white p-4 rounded shadow">
			<div class="row mb-3">
				<div class="col-md-4">
					<label for="Nitrogen">Nitrogen</label>
					<input type="number" class="form-control" name="Nitrogen" placeholder="Enter Nitrogen" step="any"
						required>
				</div>
				<div class="col-md-4">
					<label for="Phosphorus">Phosphorus</label>
					<input type="number" class="form-control" name="Phosphorus" placeholder="Enter Phosphorus"
						step="any" required>
				</div>
				<div class="col-md-4">
					<label for="Potassium">Potassium</label>
					<input type="number" class="form-control" name="Potassium" placeholder="Enter Potassium" step="any"
						required>
				</div>
			</div>
			<div class="row mb-3">
				<div class="col-md-4">
					<label for="Temperature">Temperature</label>
					<input type="number" class="form-control" name="Temperature" placeholder="Enter Temperature in °C"
						step="any" required>
				</div>
				<div class="col-md-4">
					<label for="Humidity">Humidity</label>
					<input type="number" class="form-control" name="Humidity" placeholder="Enter Humidity in %"
						step="any" required>
				</div>
				<div class="col-md-4">
					<label for="pH">pH</label>
					<input type="number" class="form-control" name="pH" placeholder="Enter pH value" step="any"
						required>
				</div>
			</div>
			<div class="row mb-3">
				<div class="col-md-4">
					<label for="Rainfall">Rainfall</label>
					<input type="number" class="form-control" name="Rainfall" placeholder="Enter Rainfall in mm"
						step="any" required>
				</div>
			</div>
			<div class="text-center">
				<button type="submit" class="btn btn-primary">Get Recommendation</button>
			</div>
		</form>
		{% if result %}
		<div
			class="mt-4 alert {% if 'error' in result.lower() %}alert-danger{% else %}alert-success{% endif %} text-center">
			<h4>Recommended Crop for Cultivation is:</h4>
			<p>{{ result }}</p>
		</div>
		{% endif %}
	</div>
</body>

</html>
